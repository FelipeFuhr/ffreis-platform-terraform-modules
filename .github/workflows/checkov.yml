name: Checkov (compliance)

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkov:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: FelipeFuhr/ffreis-workflows-terraform/.github/workflows/tf-checkov.yml@4b7e11941ce1a01cd7de58c78678c6517e4665f2 # v2.1.0
    with:
      scan-directory: "."
