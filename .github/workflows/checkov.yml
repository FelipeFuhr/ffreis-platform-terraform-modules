name: Checkov (compliance)

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkov:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: FelipeFuhr/ffreis-workflows-terraform/.github/workflows/tf-checkov.yml@aa56e92856c08a837d332a2b11fc73b9681c38f2 # v2.3.1
    with:
      scan-directory: "."
      # REQUIRED with v2.1.0+. Those releases made the runner an input defaulting
      # to ["self-hosted","local"], and those runners belong to ffreis-org while
      # this repo is under FelipeFuhr — a different owner, so they never serve it.
      # Bumping the pin without this override turned a 14s failure into jobs that
      # queued forever (reverted in d70aa30). Every job in this repo runs
      # ubuntu-latest; keep it that way.
      runner: '["ubuntu-latest"]'
